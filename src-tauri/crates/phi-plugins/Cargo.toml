[package]
name = "phi-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phi-kernel = { path = "../phi-kernel" }
phi-domain = { path = "../phi-domain" }
phi-contracts = { path = "../phi-contracts" }
phi-i18n = { path = "../phi-i18n" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# Android has no OpenSSL in the NDK, so cross-compilation uses rustls there.
# Desktop keeps native-tls (Schannel on Windows, system TLS elsewhere).
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }

[dev-dependencies]
phi-adapters = { path = "../phi-adapters" }
